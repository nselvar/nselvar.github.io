            <h4></h4>

            <style>
                .accordion { max-width: 1000px; margin: 0 auto; }
                .acc-item { border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 0.75rem; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
                .acc-header { cursor: pointer; padding: 0.9rem 1rem; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
                .acc-header:hover { background: #fafafa; }
                .acc-chevron { transition: transform 200ms ease; }
                .acc-panel { max-height: 0; overflow: hidden; transition: max-height 250ms ease; border-top: 1px dashed #e5e7eb; padding: 0 1rem; }
                .acc-item.active .acc-panel { padding: 0.75rem 1rem 1rem; }
                .acc-item.active .acc-chevron { transform: rotate(90deg); }
            </style>

            <div class="accordion" id="course-accordion">

                <div class="acc-item active">
                    <div class="acc-header">
                        <span>Day 1: From Predictive Models to Autonomous Agents</span>
                        <span class="acc-chevron">›</span>
                    </div>
                    <div class="acc-panel">
                        <!-- Paste your Day 1 HTML block here -->

                    </div>
                </div>

                <div class="acc-item">
                    <div class="acc-header">
                        <span>Day 2: (title here)</span>
                        <span class="acc-chevron">›</span>
                    </div>
                    <div class="acc-panel"><p>Coming soon…</p></div>
                </div>

                <div class="acc-item">
                    <div class="acc-header">
                        <span>Day 3: (title here)</span>
                        <span class="acc-chevron">›</span>
                    </div>

                <div class="acc-item">

                        <span class="acc-chevron">›</span>
                    </div>
                    <div class="acc-panel"><p>Coming soon…</p></div>
                </div>

            </div>

            <script>
                const acc = document.getElementById('course-accordion');
                const items = Array.from(acc.querySelectorAll('.acc-item'));
                const setHeights = () => {
                  items.forEach(it => {
                    const panel = it.querySelector('.acc-panel');
                    panel.style.maxHeight = it.classList.contains('active') ? panel.scrollHeight + 'px' : '0px';
                  });
                };
                setHeights();
                window.addEventListener('resize', setHeights);

                acc.addEventListener('click', (e) => {
                  const header = e.target.closest('.acc-header');
                  if (!header) return;
                  const item = header.parentElement;
                  // close all others
                  items.forEach(it => it.classList.remove('active'));
                  // open clicked
                  item.classList.add('active');
                  setHeights();
                });
            </script>



        </div>
